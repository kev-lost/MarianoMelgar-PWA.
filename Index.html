<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariano Melgar Alertas</title>

    <!-- Enlace al Web App Manifest (Ruta relativa directa) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">

    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-4">

    <header class="text-center my-6">
        <h1 class="text-2xl font-bold text-red-500">🚨 Mariano Melgar Alertas</h1>
        <p class="text-slate-400 text-sm">Sistema Vecinal de Emergencias y Alerta Sísmica</p>
    </header>

    <main class="max-w-md mx-auto space-y-4">
        <!-- Botón de Suscripción a Notificaciones -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
            <h2 class="font-semibold mb-2">Notificaciones de Emergencia</h2>
            <button onclick="subscribeToPushNotifications()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg w-full transition">
                🔔 Activar Notificaciones Push
            </button>
        </div>

        <!-- Panel Red Mesh Vecinal -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <h2 class="font-semibold mb-2">Estado Vecinal (Red Mesh)</h2>
            <select id="mesh-status-select" class="bg-slate-700 text-white p-2 rounded-lg w-full mb-3 border border-slate-600">
                <option value="A Salvo">🟢 A Salvo</option>
                <option value="Necesito Ayuda">🔴 Necesito Ayuda</option>
                <option value="Evaluando Daños">🟡 Evaluando Daños</option>
            </select>
            <button onclick="broadcastMeshStatus()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg w-full transition">
                📡 Transmitir Estado
            </button>
        </div>

        <!-- Logs de Transmisión -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Historial Reciente</h3>
            <div id="mesh-logs" class="text-xs space-y-1 font-mono text-slate-300">
                <p class="text-slate-500">Sin registros de transmisiones aún.</p>
            </div>
        </div>
    </main>

    <!-- Vinculación con tu archivo JavaScript de lógica -->
    <script src="app.js"></script>

    <!-- Registro explícito del Service Worker para PWA / PWABuilder -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { scope: './' })
                    .then(reg => console.log('Service Worker registrado con éxito. Scope:', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
